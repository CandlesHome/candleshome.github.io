<section class="section">

<div class="grid">

<div class="card">
<img src="tulip1.jpg" style="width:100%">
<h3>Свічка Тюльпан</h3>
<p>Від 180 грн</p>
<button onclick="choose('Свічка Тюльпан')">Обрати</button>
</div>

<div class="card">
<img src="decor1.jpg" style="width:100%">
<h3>Набір декору</h3>
<p>Від 250 грн</p>
<button onclick="choose('Набір декору')">Обрати</button>
</div>

<div class="card">
<img src="aroma1.jpg" style="width:100%">
<h3>Ароматична свічка</h3>
<p>Від 200 грн</p>
<button onclick="choose('Ароматична свічка')">Обрати</button>
</div>

<div class="card">
<img src="flower1.jpg" style="width:100%">
<h3>Свічка з сухоцвітами</h3>
<p>Від 220 грн</p>
<button onclick="choose('Свічка з сухоцвітами')">Обрати</button>
</div>

</div>

</section>

<section class="info">
<p>
Після оформлення замовлення ми зв'яжемося з вами для уточнення деталей 🤍
</p>
</section>

<section class="order" id="order">

<h2>Оформлення замовлення</h2>

<select id="product">

<option value="">Оберіть товар</option>

<option value="Свічка Тюльпан">
Свічка Тюльпан
</option>

<option value="Набір декору">
Набір декору
</option>

<option value="Ароматична свічка">
Ароматична свічка
</option>

<option value="Свічка з сухоцвітами">
Свічка з сухоцвітами
</option>

</select>

<input
id="name"
placeholder="Ваше ім'я">

<input
id="phone"
placeholder="Телефон">

<textarea
id="comment"
placeholder="Ваші побажання до замовлення"
style="
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
min-height:120px;">
</textarea>

<button onclick="send()">
Відправити
</button>

</section>

<script>

function choose(product){

document.getElementById('product').value = product;

document.getElementById('order')
.scrollIntoView({
behavior:'smooth'
});

}

function send(){

const token = 'ВАШ_BOT_TOKEN';
const chat = 'ВАШ_CHAT_ID';

const p =
document.getElementById('product').value;

const n =
document.getElementById('name').value;

const ph =
document.getElementById('phone').value;

const c =
document.getElementById('comment').value;

if(!p || !n || !ph){

alert('Заповніть усі поля');

return;

}

const text = `
🕯 НОВЕ ЗАМОВЛЕННЯ

Товар: ${p}

Ім'я: ${n}

Телефон: ${ph}

Побажання:
${c}
`;

fetch(
`https://api.telegram.org/bot${token}/sendMessage`,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
chat_id:chat,
text:text
})
}
)
.then(() => {

alert('Замовлення відправлено ✅');

document.getElementById('name').value='';
document.getElementById('phone').value='';
document.getElementById('comment').value='';

})
.catch(() => {

alert('Помилка відправки');

});

}

</script>
