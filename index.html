<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candles Home</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url('Loft.jpg') center center/cover fixed;
color:#fff;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
z-index:-1;
}

.header{
text-align:center;
padding:60px 20px;
}

.header h1{
font-size:42px;
margin-bottom:10px;
}

.header p{
color:#ddd;
}

.section{
padding:20px;
max-width:1200px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.4);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:280px;
object-fit:cover;
display:block;
}

.card-content{
padding:20px;
}

.card h3{
margin-bottom:10px;
}

.card p{
margin-bottom:15px;
color:#ddd;
}

.card button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:white;
font-weight:bold;
cursor:pointer;
}

.info{
max-width:900px;
margin:40px auto;
padding:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
text-align:center;
}

.order{
max-width:800px;
margin:40px auto;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
}

.order h2{
margin-bottom:20px;
text-align:center;
}

input,
select,
textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
outline:none;
}

textarea{
min-height:120px;
resize:vertical;
}

.send{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:white;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<h1>Candles Home</h1>
<p>Свічки ручної роботи та декор для вашого дому 🤍</p>
</div>

<section class="section">

<div class="grid">

<div class="card">
<img src="tulip1.jpg">
<div class="card-content">
<h3>Свічка Тюльпан</h3>
<p> 40 грн. / 1 шт. </p>
<button onclick="choose('Свічка Тюльпан')">Обрати</button>
</div>
</div>

<div class="card">
<img src="decor1.jpg">
<div class="card-content">
<h3>Набір декору</h3>
<p>Від 150 грн.</p>
<button onclick="choose('Набір декору')">Обрати</button>
</div>
</div>

<div class="card">
<img src="aroma1.jpg">

<div class="card-content">
<h3>Ароматична свічка</h3>
<p>200 грн.</p>

<select id="aromaSelect">
<option value="">Оберіть аромат</option>
  <option value="Пало Санто">Пало Санто</option>
  <option value="Франжипані">Франжипані</option>
  <option value="Кава">Кава</option>
<option value="Уд Мигдаль">Уд Мигдаль</option>
<option value="Лаванда">Лаванда</option>
<option value="Ваніль">Ваніль</option>
<option value="Півонія">Півонія</option>
<option value="Троянда">Троянда</option>
<option value="Шафран Цедра">Шафран Цедра</option>
</select>

<button onclick="chooseAroma()">
Обрати
</button>

</div>
</div>

<div class="card">
<img src="flower1.jpg">
<div class="card-content">
<h3>Свічка з сухоцвітами</h3>
<p>220 грн.</p>
<button onclick="choose('Свічка з сухоцвітами')">Обрати</button>
</div>
</div>

</div>

</section>

<div class="info">
Після оформлення замовлення ми зв'яжемося з вами для уточнення деталей 🤍
</div>

<section class="order" id="order">

<h2>Оформлення замовлення</h2>

<select id="product">
<option value="">Оберіть товар</option>
<option value="Свічка Тюльпан">Свічка Тюльпан</option>
<option value="Набір декору">Набір декору</option>
<option value="Ароматична свічка">Ароматична свічка</option>
<option value="Свічка з сухоцвітами">Свічка з сухоцвітами</option>
</select>

<select id="quantity">
<option value="1">1 шт.</option>
<option value="2">2 шт.</option>
<option value="3">3 шт.</option>
<option value="4">4 шт.</option>
<option value="5">5 шт.</option>
<option value="10">10 шт.</option>
</select>

<input id="name" placeholder="Ваше ім'я">

<input id="phone" placeholder="Телефон">

<textarea
id="comment"
placeholder="Ваші побажання до замовлення"></textarea>

<button class="send" onclick="send()">
Відправити
</button>

</section>
<script>

function choose(product){

document.getElementById('product').value = product;

document.getElementById('order').scrollIntoView({
behavior:'smooth'
});

}
  function chooseAroma(){

const aroma =
document.getElementById('aromaSelect').value;

if(!aroma){

alert('Оберіть аромат');
return;

}

const product =
document.getElementById('product');

let option =
document.querySelector('#product option[value="Ароматична свічка"]');

if(!option){

option = document.createElement('option');
option.value = 'Ароматична свічка';
product.appendChild(option);

}

option.text =
`Ароматична свічка - ${aroma}`;

option.value =
`Ароматична свічка - ${aroma}`;

product.value =
`Ароматична свічка - ${aroma}`;

document.getElementById('order')
.scrollIntoView({
behavior:'smooth'
});

  }
